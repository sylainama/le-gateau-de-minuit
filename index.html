<!doctype html><html lang="fr"><head>

<title>Le Gâteau de minuit — Un film interactif pour Lou</title>

<style>
:root{color-scheme:dark;--gold:#f5c780;--paper:#ffefdc;--muted:#c7b7c6;--line:#614755}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#342339,transparent 70%),#110f19;color:var(--paper);font:16px/1.52 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:12px clamp(10px,4vw,24px) 28px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:var(--gold)}.small,.eyebrow,header,footer{font:700 .69rem/1.5 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}header button{width:auto;padding:6px 10px;min-height:36px;font-size:.78rem}.frame{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#201824;box-shadow:0 22px 70px #07060b90}.screen{position:relative;aspect-ratio:3/2;overflow:hidden;background:#29243a}.shot{position:absolute;inset:0;background-image:url(manoir.jpg);background-size:200% 200%;background-position:var(--shot);transform-origin:var(--focus,50% 50%);animation:camera 8s ease-out both}.screen:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 65%,#15101dcc),radial-gradient(ellipse at center,transparent 47%,#100c1955);pointer-events:none}.cinema{position:absolute;z-index:1;left:14px;bottom:9px;color:#fff2da;text-shadow:0 2px 6px #000}.danger .shot{filter:saturate(.73) brightness(.8)}.body{padding:clamp(16px,4.5vw,27px);position:relative}.eyebrow{color:var(--gold);margin:0 0 7px}.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--gold);margin-bottom:10px}.hud span:last-child{color:var(--muted)}h1,h2{margin:0 0 10px;font:normal clamp(2.15rem,8vw,4.1rem)/1 Georgia,serif;letter-spacing:-.045em}h2{font-size:clamp(1.95rem,7vw,3.3rem)}em{color:var(--gold)}p{margin:0 0 14px;color:#eddae3}.lead{max-width:51ch}.choices{display:grid;gap:7px}button{min-height:45px;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#312334;color:var(--paper);font:700 .94rem/1.3 system-ui;text-align:left;cursor:pointer}button:hover{border-color:var(--gold);background:#422b40}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button.primary{color:#241725;background:var(--gold);border-color:var(--gold);text-align:center}button.primary:hover{background:#ffdb9d}.footnote{color:var(--muted);font-size:.78rem;margin:10px 0 0}footer{text-align:center;color:var(--muted);margin:14px 0 0}.flash{animation:flare .55s ease-out both;pointer-events:none;position:absolute;z-index:2;inset:0;background:radial-gradient(ellipse at 45% 60%,#ffedbb90,transparent 70%)}@keyframes flare{to{opacity:0}}@keyframes camera{from{transform:scale(1)}to{transform:scale(1.075)}}@media(prefers-reduced-motion:reduce){.shot,.flash{animation:none}.flash{display:none}}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.screen{isolation:isolate}.screen:after{z-index:1}.hotspots{position:absolute;inset:0;z-index:5;pointer-events:none}.candle{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:50%;background:transparent;pointer-events:auto;color:#fff0b6;text-shadow:0 0 10px #ffae29}.candle:hover{background:#c7763255}.candle span{width:10px;height:20px;font-size:0;border-radius:80% 25% 65% 35%;background:linear-gradient(#fff1bd,#ffc267 75%,#ff8a47);box-shadow:0 0 16px 5px #ff9f37a0;transform:rotate(10deg);animation:flicker .65s alternate infinite}.candle.found{pointer-events:none;animation:collect .42s ease-out forwards}.choices button:disabled{opacity:.5;cursor:default}.inventory{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:-3px 0 14px}.inventory i{height:7px;border-radius:2px;background:#473649}.inventory i.lit{background:#f5c780;box-shadow:0 0 7px #e098526f}.moonlight{position:absolute;z-index:1;inset:0;background:linear-gradient(118deg,transparent 35%,#9bbbed1c 49%,transparent 61%);animation:moon 7s ease-in-out infinite alternate;pointer-events:none}.dust{position:absolute;inset:0;z-index:2;pointer-events:none}.dust i{position:absolute;left:var(--x);bottom:8%;width:3px;height:3px;background:#ffdf9b;border-radius:50%;animation:dust 5.5s var(--t) linear infinite}.actor{position:absolute;z-index:3;width:19%;aspect-ratio: .753;bottom:5%;left:12%;transform-origin:50% 100%;pointer-events:none;animation:enter 2s ease-out both}.actor.search{animation:search 2.2s ease-in-out both}.actor.retreat{animation:retreat .85s ease-out both}.sprite{position:absolute;inset:0;background:url(lou-marche.png) 0 0/400% 100% no-repeat;filter:drop-shadow(2px 4px 4px #090713c0);animation:steps .56s steps(1) 4}.torch{position:absolute;top:33%;left:77%;width:185%;height:40%;transform-origin:0 50%;clip-path:polygon(0 50%,100% 0,100% 100%);background:linear-gradient(90deg,#fff0a273,transparent);animation:sweep 2s ease-in-out infinite alternate}.creature{position:absolute;z-index:2;right:12%;bottom:18%;width:13%;height:30%;border-radius:53% 43% 39% 37%;background:radial-gradient(at 50% 22%,#232034,#0b0915 60%);box-shadow:0 0 17px #110d2399;transform-origin:50% 100%;animation:creep 2s ease-in-out both;pointer-events:none}.creature:before,.creature:after{content:'';position:absolute;width:30%;height:55%;top:40%;border-radius:80%;background:#100d1a;transform-origin:50% 0;animation:claws .8s ease-in-out infinite alternate}.creature:before{left:-9%;--angle:30deg}.creature:after{right:-9%;--angle:-30deg}.creature i,.creature b{position:absolute;z-index:1;top:27%;width:13%;height:7%;border-radius:50%;background:#ffdd8c;box-shadow:0 0 8px #ffbb73;animation:blink 3.2s infinite}.creature i{left:29%}.creature b{left:54%}.creature.search{animation:flee 1.3s ease-in both}.creature.retreat{animation:lunge .82s ease-out both}@keyframes steps{0%{background-position:0 0}25%{background-position:33.333% 0}50%{background-position:66.666% 0}75%{background-position:100% 0}}@keyframes enter{from{transform:translateX(-135%) scale(.85)}to{transform:translateX(6%)}}@keyframes search{from{transform:translateX(-5%)}to{transform:translateX(95%) scale(.94)}}@keyframes retreat{0%{transform:translateX(65%)}100%{transform:translateX(-160%) rotate(-9deg)}}@keyframes creep{from{transform:translateX(80%) scale(.62);opacity:.1}to{transform:translateX(0);opacity:1}}@keyframes flee{to{transform:translateX(155%) scale(.72);opacity:0}}@keyframes lunge{from{transform:scale(.8)}to{transform:translateX(-105%) scale(1.66) rotate(-13deg)}}@keyframes blink{0%,42%,49%,100%{transform:scaleY(1)}45%{transform:scaleY(.05)}}@keyframes claws{from{transform:rotate(var(--angle))}to{transform:rotate(0deg)}}@keyframes sweep{from{transform:rotate(-12deg);opacity:.6}to{transform:rotate(8deg);opacity:1}}@keyframes dust{0%{transform:translateY(0);opacity:0}40%{opacity:.6}100%{transform:translate(16px,-210px);opacity:0}}@keyframes moon{to{transform:translateX(15%)}}@keyframes flicker{to{transform:rotate(-7deg) scale(.8,1.13);opacity:.82}}@keyframes collect{to{transform:translate(-50%,-115%) scale(1.45);opacity:0}}@media(prefers-reduced-motion:reduce){.actor,.creature,.creature *,.creature:before,.creature:after,.torch,.dust i,.moonlight,.sprite,.candle,.candle span{animation:none!important}.candle.found,.creature.search{visibility:hidden}.dust{display:none}}
.final-flames{position:absolute;z-index:3;bottom:4%;left:50%;transform:translateX(-50%);width:77%;display:flex;justify-content:space-between;gap:2px;padding:5px 8px;background:#281521c9;border-radius:10px}.final-flames i{display:block;width:6px;height:12px;background:#ffd28b;border-radius:90% 25% 75% 45%;box-shadow:0 0 9px #ffa648;animation:light .28s var(--delay) both}@keyframes light{from{opacity:.15;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.final-flames i{animation:none}}</style></head>
